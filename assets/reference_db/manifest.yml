# ==============================================================================
# Reference database manifest
# ==============================================================================
#
# One entry per species. Each entry's files live in a directory named after its
# `name`, next to this manifest, with one folder per file type:
#
#   reference_db/
#     manifest.yml
#     candidozyma_auris/
#       assembly/GCA_016772135.1.fna.gz
#       annotation/GCA_016772135.1.gff.gz
#
# A file path is used as written if it exists (absolute, or relative to the
# launch directory); otherwise it is looked for at <name>/<assembly|annotation>/<file>.
#
# Species fields (apply to every subtype; a subtype can override them)
#   name          required  ID and directory name. Letters, numbers, '.', '_', '-'; unique.
#   species       required  Species names. The first is preferred; the rest are aliases.
#   ploidy        optional  Used for variant calling.
#   subtype_ani   optional  ANI threshold for subtyping: fraction (0.997)
#   length_range  optional  Acceptable de novo assembly length for automated QC, in bp:
#                           [min, max]. Species level only.
#   gc_range      optional  Acceptable de novo assembly GC content for automated QC, in %:
#                           [min, max]. Species level only.
#   subtypes      required  One entry per subtype (below).
#
# Subtype fields
#   subtype       required  Subtype names; unique within the species.
#   assembly      required  Reference assembly (FASTA, may be gzipped). File in <name>/assembly/, or a path.
#   annotation    optional  Annotation for the assembly (GFF). File in <name>/annotation/, or a path.
#   amr           optional  AMR target regions, in the assembly's coordinates:
#                             chrom, gene, coords: [start, end],
#                             regions: [ { name, coords: [start, end] }, ... ]
#                           Requires `annotation`. Samples on this subtype are annotated
#                           with a snpEff database built from its assembly and annotation.
#                           Each target's `gene` must match a gene name in `annotation`;
#                           on the primary subtype these genes are also the regions
#                           extracted for samples on subtypes without `amr`.
#   primary       optional  true for the subtype whose AMR targets are used for samples on
#                           subtypes without `amr`. Only needed when more than one subtype
#                           has `amr`; a single `amr` subtype is primary automatically.
#
# Automated QC ranges
#   A sample fails QC if its de novo assembly length or GC content falls outside
#   its species' range. `length_range` and `gc_range` are used when set here;
#   otherwise the range comes from the NCBI statistics (--ncbi_stats), each
#   metric separately. If neither has a range, the check is reported as
#   undetermined and does not fail the sample. The NCBI file's `length_range` and
#   `gc_range` for a species are a starting point for these values.
#
# Analysis settings (optional; species and/or subtype level)
#   Any of these pipeline parameters can be set on a species entry or a subtype,
#   using the same name as the parameter. The most specific level wins:
#
#     subtype  >  species  >  run (--param on the command line, params file, config)
#
#   so a run-level value only applies to species/subtypes that don't set their
#   own. Values are checked when the manifest is loaded, and the ones that differ
#   from the run are listed in the log at startup.
#
#   Variant calling   limit_coverage, min_base_depth, min_base_quality,
#                     min_mapping_quality, min_allele_fraction,
#                     min_fwd_strand_fraction, max_strand_bias, max_read_pos_bias
#   Phylogenetics     min_genome_fraction, min_core_fraction, strong_link_threshold,
#                     inter_link_threshold, partition_distance
#
#   Samples with a reference supplied in the samplesheet use the run-level values.
#   All samples in one tree (species + subtype) share its phylogenetic settings.
#
# Any other field is passed through to the pipeline unchanged.
#
# ------------------------------------------------------------------------------
# Template: copy, uncomment and fill in
# ------------------------------------------------------------------------------
#
# ## Genus species
# - name: genus_species
#   species:
#     - Genus species
#   ploidy: 1
#   subtype_ani: 0.997
#   length_range: [11000000, 13000000]   # QC: assembly length, bp
#   gc_range: [40.0, 49.5]               # QC: assembly GC, %
#   min_allele_fraction: 0.8      # species-level setting (all subtypes)
#   partition_distance: 25
#   subtypes:
#     - subtype: [Subtype A]
#       assembly: GCA_000000000.1.fna.gz
#       annotation: GCA_000000000.1.gff.gz
#       min_core_fraction: 0.95   # subtype-level setting (this subtype only)
#       primary: true
#       amr:
#         - chrom: CONTIG_ID
#           gene: GENE
#           coords: [1, 1000]
#           regions:
#             - name: REGION
#               coords: [100, 200]
#
# ==============================================================================

## Candidozyma auris
- name: candidozyma_auris
  species:
    - Candidozyma auris
    - Candida auris
  ploidy: 1
  subtype_ani: 0.997
  # Variant calling
  limit_coverage: 100
  min_base_depth: 10
  min_base_quality: 30
  min_mapping_quality: 40
  min_allele_fraction: 0.8
  min_fwd_strand_fraction: 0.3
  max_strand_bias: 15
  max_read_pos_bias: 30
  # Phylogenetics
  min_genome_fraction: 0.9
  min_core_fraction: 0.9
  strong_link_threshold: 5
  inter_link_threshold: 10
  partition_distance: 25
  subtypes:
    - subtype: [Clade I]
      assembly: GCA_016772135.1.fna.gz
      annotation: GCA_016772135.1.gff.gz
      amr:
        - chrom: CP060340.1
          gene: FKS1
          coords: [219735, 225401]
          regions:
            - name: HS1
              coords: [221637, 221663]
            - name: HS2
              coords: [223782, 223805]
            - name: HS3
              coords: [221805, 221807]
    - subtype: [Clade II]
      assembly: GCF_003013715.1.fna.gz
    - subtype: [Clade III]
      assembly: GCF_002775015.1.fna.gz
    - subtype: [Clade IV]
      assembly: GCA_003014415.1.fna.gz
    - subtype: [Clade V]
      assembly: GCA_016809505.1.fna.gz